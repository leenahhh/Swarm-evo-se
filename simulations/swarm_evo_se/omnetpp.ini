# ===========================================================
# URBAN FULL DEMO:
# Real OMNeT++ packet flow for authentication, pseudonym generation,
# swarm acceptance, safety message authentication, malicious rejection,
# and revocation.
# ===========================================================
[Config UrbanFullDemo]
description = "Urban full demo: authentication, pseudonym generation, swarm acceptance, malicious revocation"

network = SwarmNetwork
sim-time-limit = 40s

*.manager.launchConfig = xmldoc("../../scripts/sumo_urban_full_demo.launchd.xml")

SwarmNetwork.playgroundSizeX = 600m
SwarmNetwork.playgroundSizeY = 600m
SwarmNetwork.playgroundSizeZ = 50m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 300m
*.connectionManager.drawMaxIntfDist = true

*.node[*].applType = "SwarmVehicle"
*.node[*].appl.headerLength = 80bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 5s

# Fast demo timing
**.epochDuration = 30s
**.preActivationLead = 10s
**.trustCacheTTL = 30
**.acfMaxStaleness = 3
**.proofPoolPrecompute = 100
**.dashboardPort = 8765

# Controlled demo trace
*.node[*].appl.demoTrace = true
*.node[0].appl.demoRole = "LEGIT_SENDER"
*.node[1].appl.demoRole = "LEGIT_RECEIVER"
*.node[2].appl.demoRole = "VALIDATOR_1"
*.node[3].appl.demoRole = "VALIDATOR_2"
*.node[4].appl.demoRole = "VALIDATOR_3"
*.node[5].appl.demoRole = "MALICIOUS"

# Keep old random malicious assignment disabled.
**.maliciousRatio = 0.0
**.maliciousMode = "NONE"

[Config UrbanEndToEndDemo]
description = "Urban end-to-end demo: authentication, pseudonym generation, swarm acceptance, revocation, and malicious rejection"

network = SwarmNetwork
sim-time-limit = 45s

*.manager.launchConfig = xmldoc("../../scripts/sumo_urban_full_demo.launchd.xml")

SwarmNetwork.playgroundSizeX = 600m
SwarmNetwork.playgroundSizeY = 600m
SwarmNetwork.playgroundSizeZ = 50m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 300m
*.connectionManager.drawMaxIntfDist = true

*.node[*].applType = "SwarmVehicle"
*.node[*].appl.headerLength = 80bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 5s

# Fast demo timing
**.epochDuration = 30s
**.preActivationLead = 10s
**.trustCacheTTL = 30
**.acfMaxStaleness = 3
**.proofPoolPrecompute = 100
**.dashboardPort = 8765

# Controlled demo trace
*.node[*].appl.demoTrace = true

# Demo roles
*.node[0].appl.demoRole = "LEGIT_SENDER"
*.node[1].appl.demoRole = "LEGIT_RECEIVER"
*.node[2].appl.demoRole = "VALIDATOR_1"
*.node[3].appl.demoRole = "VALIDATOR_2"
*.node[4].appl.demoRole = "VALIDATOR_3"
*.node[5].appl.demoRole = "MALICIOUS"

# Disable random malicious assignment for normal nodes
**.maliciousRatio = 0.0
**.maliciousMode = "NONE"

# Force node[5] to be the malicious vehicle for the controlled demo
*.node[5].appl.maliciousRatio = 1.0
*.node[5].appl.maliciousMode = "INVALID_ZK"
